name: Sync QuestCraft Repositories

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  clone-and-commit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Clone UI Repo with LFS enabled
      - name: Checkout QuestCraft UI Repo
        uses: actions/checkout@v4
        with:
          repository: 'QuestCraftPlusPlus/QCXR-XR-Wrapper'
          path: 'questcraft-ui'
          submodules: 'recursive'
          lfs: true

      # Step 3: Clone Backend Repo with LFS enabled
      - name: Checkout QuestCraft Engine/Pojlib Repo
        uses: actions/checkout@v4
        with:
          repository: 'QuestCraftPlusPlus/Pojlib'
          path: 'questcraft-backend'
          submodules: 'recursive'
          lfs: true

      # Step 4: Remove inner git references and set LFS fallback config
      - name: Prepare folders and Git LFS settings
        run: |
          rm -rf questcraft-ui/.git
          rm -rf questcraft-backend/.git
          git config --global lfs.allowincompletepush true

      # Step 5: Commit and push changes
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add questcraft-ui questcraft-backend
          if git diff --staged --quiet; then
            echo "No changes detected to commit."
          else
            git commit -m "Automated sync: Pulled latest QuestCraft UI and Backend code"
            git push
          fi
