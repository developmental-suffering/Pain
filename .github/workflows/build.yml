name: Sync QuestCraft Repositories

on:
  workflow_dispatch: # Manual run trigger
  schedule:
    - cron: '0 0 * * 0' # Optional: Syncs weekly on Sunday at midnight

jobs:
  clone-and-commit:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout your repository
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Clone the UI / Wrapper Repository
      - name: Checkout QuestCraft UI Repo
        uses: actions/checkout@v4
        with:
          repository: 'QuestCraftPlusPlus/QCXR-XR-Wrapper' # Or 'QuestCraftPlusPlus/Launcher'
          path: 'questcraft-ui'
          submodules: 'recursive'

      # Step 3: Clone the Minecraft Backend Repository
      - name: Checkout QuestCraft Engine/Pojlib Repo
        uses: actions/checkout@v4
        with:
          repository: 'QuestCraftPlusPlus/Pojlib'
          path: 'questcraft-backend'
          submodules: 'recursive'

      # Step 4: Strip out inner .git folders so they save as actual files instead of broken git submodules
      - name: Prepare folders for commit
        run: |
          rm -rf questcraft-ui/.git
          rm -rf questcraft-backend/.git

      # Step 5: Commit and push both folders to your repository
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add questcraft-ui questcraft-backend
          if git diff --staged --quiet; then
            echo "No changes detected to commit."
          else
            git commit -m "Automated sync: Pulled latest QuestCraft UI and Backend code"
            git push
          fi
