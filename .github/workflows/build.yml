name: Sync QuestCraft Repo

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab
  schedule:
    - cron: '0 0 * * 0' # Optional: Runs automatically every Sunday at midnight

jobs:
  clone-and-commit:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout your destination repository
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Clone the QuestCraft repository into a temporary folder
      - name: Checkout QuestCraft source repository
        uses: actions/checkout@v4
        with:
          repository: 'QuestCraftPlusPlus/QuestCraft' # Adjust if using a different specific organization/repo
          path: 'temp-questcraft'

      # Step 3: Copy the folders into your repository root and remove temp files
      - name: Copy QuestCraft files
        run: |
          # Copy everything except hidden .git metadata from the source
          rsync -av --exclude='.git' temp-questcraft/ ./
          
          # Clean up temporary clone directory
          rm -rf temp-questcraft

      # Step 4: Commit and push changes if updates were detected
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          if git diff --staged --quiet; then
            echo "No changes detected to commit."
          else
            git commit -m "Automated sync: Updated QuestCraft repository contents"
            git push
          fi
